name: Build Native Miogram Desktop

on:
  push:
    branches: [ "dev", "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "dev", "master", "main" ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Native Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Run Build in centos_env container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/usr/src/tdesktop" \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D TDESKTOP_API_ID=2040 \
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Package Linux Binary
        run: |
          mkdir -p package/miogram
          if [ -f "out/Release/Telegram" ]; then
            cp out/Release/Telegram package/miogram/miogram
          elif [ -f "out/Release/Miogram" ]; then
            cp out/Release/Miogram package/miogram/miogram
          else
            find out/ -type f -executable -exec cp {} package/miogram/ \;
          fi
          cd package
          tar -czvf miogram-desktop-linux-x64.tar.gz miogram/
          cd ..

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: miogram-desktop-linux-x64
          path: package/miogram-desktop-linux-x64.tar.gz

  release:
    name: Publish Release Artifacts
    needs: [build-linux]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          name: Miogram Desktop ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
